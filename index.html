<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- Dynamic title is set by JavaScript -->
    <title>Loading...</title>

    <meta
        name="description"
        content="Digital Business Card"
    >

    <meta
        name="theme-color"
        content="#ff7a00"
    >

    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <!-- =====================================================
         CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body class="dark">


<!-- =========================================================
     MAIN CONTAINER
========================================================= -->

<main class="container">


    <!-- =====================================================
         PROFILE CARD
    ====================================================== -->

    <section class="card">


        <!-- =================================================
             PROFILE HEADER
        ================================================== -->

        <div class="profile-header">


            <!-- Profile Image -->

            <div class="profile-image-container">

                <img
                    id="profilePhoto"
                    class="profile-photo"
                    src="assets/profile.jpg"
                    alt="Profile Photo"
                >

            </div>


            <!-- Profile Information -->

            <div class="profile-info">

                <h1
                    id="profileName"
                    class="profile-name"
                >
                    Loading...
                </h1>


                <h2
                    id="profileTitle"
                    class="profile-title"
                >
                    Loading...
                </h2>


                <p
                    id="profileBio"
                    class="profile-bio"
                >
                </p>

            </div>

        </div>



        <!-- =================================================
             SOCIAL LINKS
        ================================================== -->

        <div class="social-links">


            <!-- LinkedIn -->

            <a
                id="linkedinLink"
                class="social-link linkedin-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="LinkedIn"
            >

                <i class="fa-brands fa-linkedin-in"></i>

            </a>


            <!-- GitHub -->

            <a
                id="githubLink"
                class="social-link github-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="GitHub"
            >

                <i class="fa-brands fa-github"></i>

            </a>


            <!-- Facebook -->

            <a
                id="facebookLink"
                class="social-link facebook-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Facebook"
            >

                <i class="fa-brands fa-facebook-f"></i>

            </a>


            <!-- Instagram -->

            <a
                id="instagramLink"
                class="social-link instagram-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Instagram"
            >

                <i class="fa-brands fa-instagram"></i>

            </a>


            <!-- X / Twitter -->

            <a
                id="twitterLink"
                class="social-link twitter-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
                aria-label="Twitter"
            >

                <i class="fa-brands fa-x-twitter"></i>

            </a>

        </div>



        <!-- =================================================
             CONTACT BUTTONS
        ================================================== -->

        <div class="contact-buttons">


            <!-- Call -->

            <a
                class="action-button phone-link"
                href="#"
            >

                <i class="fa-solid fa-phone"></i>

                <span>Call</span>

            </a>


            <!-- WhatsApp -->

            <a
                class="action-button whatsapp-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <i class="fa-brands fa-whatsapp"></i>

                <span>WhatsApp</span>

            </a>


            <!-- Email -->

            <a
                class="action-button email-link"
                href="#"
            >

                <i class="fa-solid fa-envelope"></i>

                <span>Email</span>

            </a>

        </div>



        <!-- =================================================
             MAIN ACTIONS
        ================================================== -->

        <div class="main-actions">


            <!-- Save Contact -->

            <button
                type="button"
                class="main-action save-contact"
            >

                <i class="fa-solid fa-address-card"></i>

                <span>Save Contact</span>

            </button>


            <!-- Share -->

            <button
                type="button"
                class="main-action share-card"
            >

                <i class="fa-solid fa-share-nodes"></i>

                <span>Share</span>

            </button>


            <!-- QR -->

            <button
                type="button"
                class="main-action qr-button"
            >

                <i class="fa-solid fa-qrcode"></i>

                <span>QR Code</span>

            </button>


            <!-- CV -->

            <a
                id="cvLink"
                class="main-action cv-link"
                href="#"
                target="_blank"
                rel="noopener noreferrer"
            >

                <i class="fa-solid fa-file-pdf"></i>

                <span>CV</span>

            </a>

        </div>



        <!-- =================================================
             QR CODE
        ================================================== -->

        <div class="qr-section">


            <p class="qr-label">
                Scan to open my digital card
            </p>


            <img
                class="qr-code"
                src=""
                alt="QR Code"
                loading="lazy"
            >

        </div>



        <!-- =================================================
             THEME SWITCH
        ================================================== -->

        <div class="theme-switch">


            <button
                id="lightThemeBtn"
                type="button"
                aria-label="Light Mode"
                title="Light Mode"
            >

                <i class="fa-solid fa-sun"></i>

            </button>


            <button
                id="darkThemeBtn"
                type="button"
                aria-label="Dark Mode"
                title="Dark Mode"
            >

                <i class="fa-solid fa-moon"></i>

            </button>

        </div>



        <!-- =================================================
             FOOTER
        ================================================== -->

        <footer class="card-footer">

            <p>
                Digital Business Card
            </p>

            <p>
                Powered by NFC Technology
            </p>

        </footer>


    </section>


</main>



<!-- =========================================================
     QR MODAL
========================================================= -->

<div
    id="qrModal"
    class="qr-modal"
    role="dialog"
    aria-modal="true"
    aria-label="QR Code"
>


    <div class="qr-modal-content">


        <!-- Close -->

        <button
            type="button"
            class="qr-close"
            aria-label="Close QR Code"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


        <!-- Profile Name -->

        <h2
            id="qrModalName"
            class="qr-modal-title"
        >
            QR Code
        </h2>


        <!-- Large QR -->

        <img
            class="qr-large"
            src=""
            alt="Large QR Code"
        >


        <!-- Instruction -->

        <p class="qr-modal-text">

            Scan this QR code to open
            the digital business card.

        </p>


    </div>

</div>



<!-- =========================================================
     TOAST MESSAGE
========================================================= -->

<div
    id="toastMessage"
    class="toast-message"
    role="status"
    aria-live="polite"
>
</div>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script src="script.js"></script>


<!-- =========================================================
     QR BUTTON
========================================================= -->

<script>

document.addEventListener(
    "DOMContentLoaded",
    () => {

        const qrButton =
            document.querySelector(
                ".qr-button"
            );

        const qrModal =
            document.getElementById(
                "qrModal"
            );

        const qrImage =
            document.querySelector(
                ".qr-code"
            );

        const qrLarge =
            document.querySelector(
                ".qr-large"
            );

        const qrClose =
            document.querySelector(
                ".qr-close"
            );

        const qrModalName =
            document.getElementById(
                "qrModalName"
            );


        /*
         * Open QR modal
         */

        if (qrButton) {

            qrButton.addEventListener(
                "click",
                () => {

                    if (qrImage && qrLarge) {

                        qrLarge.src =
                            qrImage.src;

                    }


                    if (
                        qrModalName &&
                        window.currentProfile
                    ) {

                        qrModalName.textContent =
                            window.currentProfile.name ||
                            "QR Code";

                    }


                    if (qrModal) {

                        qrModal.classList.add(
                            "active"
                        );

                        document.body.style.overflow =
                            "hidden";
                    }

                }
            );

        }


        /*
         * Close button
         */

        if (qrClose) {

            qrClose.addEventListener(
                "click",
                () => {

                    closeQRModal();

                }
            );

        }


        /*
         * Close when clicking background
         */

        if (qrModal) {

            qrModal.addEventListener(
                "click",
                event => {

                    if (
                        event.target === qrModal
                    ) {

                        closeQRModal();

                    }

                }
            );

        }


        /*
         * ESC key
         */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    closeQRModal();

                }

            }
        );


        function closeQRModal() {

            if (qrModal) {

                qrModal.classList.remove(
                    "active"
                );

                document.body.style.overflow =
                    "";

            }

        }

    }
);

</script>


</body>

</html>
